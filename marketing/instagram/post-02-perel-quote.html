<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; }
.slide { width: 1080px; height: 1080px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 100px; text-align: center; background: linear-gradient(180deg, #f7f5fd 0%, #edf8e4 100%); position: relative; }
.quote-mark { font-family: 'Instrument Sans', sans-serif; font-size: 200px; color: #96d35f; opacity: 0.25; line-height: 0.6; margin-bottom: 20px; }
h2 { font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 52px; color: #211e28; line-height: 1.3; letter-spacing: -1px; margin-bottom: 40px; }
.cite { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 22px; color: #81b756; letter-spacing: 1px; }
.logo { position: absolute; bottom: 60px; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 20px; color: #a09bac; }
</style>
</head><body>
<div class="slide">
  <div class="quote-mark">&ldquo;</div>
  <h2>The quality of your relationships determines the quality of your life.</h2>
  <p class="cite">&mdash; ESTHER PEREL</p>
  <div class="logo">@heyotis.app</div>
</div>
</body></html>
