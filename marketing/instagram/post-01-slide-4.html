<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; }
.slide { width: 1080px; height: 1080px; display: flex; flex-direction: column; justify-content: center; padding: 100px; background: #f7f5fd; position: relative; }
.num { font-family: 'Instrument Sans', sans-serif; font-weight: 700; font-size: 120px; color: #f67700; opacity: 0.2; position: absolute; top: 60px; right: 80px; }
.icon { font-size: 64px; margin-bottom: 24px; }
h2 { font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 48px; color: #211e28; line-height: 1.25; margin-bottom: 24px; }
.highlight { color: #f67700; }
.body { font-family: 'Inter', sans-serif; font-size: 26px; color: #80798c; line-height: 1.6; }
.logo { position: absolute; bottom: 60px; left: 100px; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 18px; color: #a09bac; }
</style>
</head><body>
<div class="slide">
  <div class="num">03</div>
  <h2>Fighting isn&rsquo;t the problem. <span class="highlight">Not repairing</span> is.</h2>
  <p class="body">Every couple fights. The ones that last don&rsquo;t avoid conflict &mdash; they come back to each other after it. Repair is the skill that matters most.</p>
  <div class="logo">@heyotis.app</div>
</div>
</body></html>
