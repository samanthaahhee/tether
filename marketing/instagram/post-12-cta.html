<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; }
.slide { width: 1080px; height: 1080px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 100px; text-align: center; background: #f7f5fd; position: relative; }
.icon { width: 80px; height: 80px; border-radius: 20px; background: #96d35f; display: flex; align-items: center; justify-content: center; margin-bottom: 40px; box-shadow: 0 8px 24px rgba(150,211,95,0.3); }
h2 { font-family: 'Instrument Sans', sans-serif; font-weight: 700; font-size: 56px; color: #211e28; line-height: 1.2; letter-spacing: -1px; margin-bottom: 24px; }
.sub { font-family: 'Inter', sans-serif; font-size: 26px; color: #80798c; line-height: 1.6; margin-bottom: 48px; }
.btn { display: inline-block; background: #96d35f; color: #211e28; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 24px; padding: 20px 56px; border-radius: 9999px; }
.features { display: flex; gap: 32px; margin-top: 48px; }
.feat { font-family: 'Inter', sans-serif; font-size: 16px; color: #a09bac; display: flex; align-items: center; gap: 8px; }
.feat .dot { width: 8px; height: 8px; border-radius: 50%; background: #96d35f; }
.logo { position: absolute; bottom: 60px; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 20px; color: #a09bac; }
</style>
</head><body>
<div class="slide">
  <div class="icon">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c1.5 0 3-.3 4.3-.9"/><path d="M17 8c-1.5 0-3 1-3.5 2.5L12 15l3-1c1.5 0 3-1 3.5-2.5S18.5 8 17 8z"/></svg>
  </div>
  <h2>Your pocket relationship coach.</h2>
  <p class="sub">No waitlist. No awkward first session.<br>Just you, your feelings, and a path forward.</p>
  <div class="btn">Get early access</div>
  <div class="features">
    <div class="feat"><span class="dot"></span>Free to start</div>
    <div class="feat"><span class="dot"></span>100% private</div>
    <div class="feat"><span class="dot"></span>Evidence-based</div>
  </div>
  <div class="logo">@heyotis.app</div>
</div>
</body></html>
