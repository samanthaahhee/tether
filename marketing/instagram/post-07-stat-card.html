<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; }
.slide { width: 1080px; height: 1080px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 100px; text-align: center; background: linear-gradient(180deg, #92a6f4 0%, #c5cffa 40%, #f7f5fd 70%); position: relative; }
.stat { font-family: 'Instrument Sans', sans-serif; font-weight: 700; font-size: 160px; color: #211e28; line-height: 1; margin-bottom: 16px; }
.unit { font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 48px; color: #211e28; margin-bottom: 40px; }
h2 { font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 44px; color: #211e28; line-height: 1.25; margin-bottom: 32px; }
.sub { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 28px; color: #3a3630; }
.logo { position: absolute; bottom: 60px; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 20px; color: rgba(33,30,40,0.4); }
</style>
</head><body>
<div class="slide">
  <div class="stat">6</div>
  <div class="unit">years</div>
  <h2>The average time couples wait before seeking help.</h2>
  <p class="sub">You don&rsquo;t have to wait.</p>
  <div class="logo">@heyotis.app</div>
</div>
</body></html>
