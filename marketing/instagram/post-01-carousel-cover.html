<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; }
.slide { width: 1080px; height: 1080px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px; text-align: center; background: #f7f5fd; position: relative; }
.badge { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: #81b756; margin-bottom: 48px; }
h1 { font-family: 'Instrument Sans', sans-serif; font-weight: 700; font-size: 72px; color: #211e28; line-height: 1.15; letter-spacing: -2px; margin-bottom: 40px; }
h1 em { font-style: normal; color: #96d35f; }
.sub { font-family: 'Inter', sans-serif; font-size: 24px; color: #80798c; line-height: 1.6; }
.accent-line { width: 60px; height: 4px; background: #96d35f; border-radius: 2px; margin-bottom: 48px; }
.logo { position: absolute; bottom: 60px; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 20px; color: #80798c; }
</style>
</head><body>
<div class="slide">
  <div class="badge">Relationship Science</div>
  <div class="accent-line"></div>
  <h1>5 things couples therapists <em>wish</em> you knew</h1>
  <p class="sub">Swipe to learn what 40+ years of research reveals</p>
  <div class="logo">@heyotis.app</div>
</div>
</body></html>
